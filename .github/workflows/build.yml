
name: Build Maktab Website

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Maktab ZIP
        run: |
          mkdir -p project
          unzip -q "darul-ilm-maktab-management-system (2).zip" -d project

      - name: Find Project
        run: |
          DIR=$(find project -name package.json -not -path '*/node_modules/*' -print -quit | xargs dirname)
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install --legacy-peer-deps

      - name: Build Website
        run: |
          cd "$PROJECT_DIR"
          npm run build

      - name: Upload Website
        uses: actions/upload-artifact@v4
        with:
          name: maktab-hosting-files
          path: ${{ env.PROJECT_DIR }}/dist/
